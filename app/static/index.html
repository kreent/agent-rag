<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura — Inteligencia climática del IDEAM</title>
  <meta name="description" content="Aura, tu asistente de inteligencia climática del IDEAM.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css?v=aura23">
</head>

<body>
  <div class="app">

    <!-- ───── SIDEBAR ───── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <img src="static/aura.png" alt="Aura" class="sidebar-logo">
      </div>

      <button class="btn-new-chat" id="newChatBtn">
        <span class="plus">+</span> Nueva conversación
      </button>

      <nav class="sidebar-questions" aria-label="Preguntas sugeridas">
        <h3 class="sidebar-section-title">Preguntas sugeridas</h3>
        <ul class="question-list">
          <li><button class="question-item" data-q="¿Quién es la directora del IDEAM?"><span class="dot dot-person"></span><span>¿Quién es la directora del IDEAM?</span></button></li>
          <li><button class="question-item" data-q="¿Cuál es la ciudad donde más llueve en Colombia?"><span class="dot dot-rain"></span><span>¿Cuál es la ciudad donde más llueve en Colombia?</span></button></li>
          <li><button class="question-item" data-q="¿Qué sabes del huracán Beryl?"><span class="dot dot-hurricane"></span><span>¿Qué sabes del huracán Beryl?</span></button></li>
          <li><button class="question-item" data-q="¿Qué es el material particulado?"><span class="dot dot-air"></span><span>¿Qué es el material particulado?</span></button></li>
          <li><button class="question-item" data-q="¿Cuánta deforestación hubo en la Amazonía colombiana?"><span class="dot dot-tree"></span><span>Deforestación en la Amazonía</span></button></li>
          <li><button class="question-item" data-q="¿Cómo afecta el cambio climático a Colombia?"><span class="dot dot-climate"></span><span>Cambio climático en Colombia</span></button></li>
          <li><button class="question-item" data-q="¿Hay reportes sobre incendios forestales?"><span class="dot dot-fire"></span><span>Incendios forestales</span></button></li>
          <li><button class="question-item" data-q="¿Cómo está la calidad del aire en Colombia?"><span class="dot dot-air"></span><span>Calidad del aire</span></button></li>
        </ul>
      </nav>

      <img src="static/mountain1.png" alt="" class="sidebar-mountains" aria-hidden="true">


      <div class="sidebar-footer">
        <span id="docCountSidebar" class="doc-count">Cargando…</span>
      </div>
    </aside>

    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ───── MAIN ───── -->
    <main class="main">

      <!-- Header -->
      <header class="main-header">
        <button class="sidebar-collapse" id="sidebarCollapse" aria-label="Colapsar menú">‹</button>
        <div class="main-title">
          <h1>Hola, soy <span class="brand">Aura</span></h1>
          <p>Tu asistente de inteligencia climática del IDEAM</p>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="historyBtn" title="Historial">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 2M12 3a9 9 0 1 0 9 9"/></svg>
          </button>
          <button class="icon-btn" title="Ayuda">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <!-- Chat content -->
      <div class="chat-area chat-empty" id="chatArea">

        <!-- Welcome screen (hidden once user sends first message) -->
        <div class="welcome" id="welcome">
          <h2 class="welcome-title">¡Hola! Soy Aura <img src="static/ia.png" alt="" class="ia-icon"></h2>
          <p class="welcome-sub">
            Estoy aquí para ayudarte con información climática,<br>
            meteorológica y ambiental de Colombia.
          </p>

          <div class="quick-grid">
            <button class="quick-card" data-q="¿Quién es la directora del IDEAM?">
              <div class="quick-icon"><img src="static/icon1.png" alt=""></div>
              <span>¿Quién es la directora del IDEAM?</span>
            </button>

            <button class="quick-card" data-q="¿Cuál es la ciudad donde más llueve en Colombia?">
              <div class="quick-icon"><img src="static/icon2.png" alt=""></div>
              <span>¿Cuál es la ciudad donde más llueve en Colombia?</span>
            </button>

            <button class="quick-card" data-q="¿Qué sabes del huracán Beryl?">
              <div class="quick-icon"><img src="static/icon3.png" alt=""></div>
              <span>¿Qué sabes del huracán Beryl?</span>
            </button>

            <button class="quick-card" data-q="¿Qué es el material particulado?">
              <div class="quick-icon"><img src="static/icon4.png" alt=""></div>
              <span>¿Qué es el material particulado?</span>
            </button>

            <button class="quick-card" data-q="¿Cuánta deforestación hubo en la Amazonía colombiana?">
              <div class="quick-icon"><img src="static/icon5.png" alt=""></div>
              <span>¿Cuánta deforestación hubo en la Amazonía?</span>
            </button>

            <button class="quick-card" data-q="¿Cómo afecta el cambio climático a Colombia?">
              <div class="quick-icon"><img src="static/icon6.png" alt=""></div>
              <span>¿Cómo afecta el cambio climático a Colombia?</span>
            </button>

            <button class="quick-card" data-q="¿Hay reportes sobre incendios forestales?">
              <div class="quick-icon"><img src="static/icon7.png" alt=""></div>
              <span>¿Hay reportes sobre incendios forestales?</span>
            </button>

            <button class="quick-card" data-q="¿Cómo está la calidad del aire en Colombia?">
              <div class="quick-icon"><img src="static/icon8.png" alt=""></div>
              <span>¿Cómo está la calidad del aire?</span>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>

        <!-- Loading: fox meditando + texto, visible mientras Aura busca -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="agent-avatar"><img src="static/aura-chat.png" alt=""></div>
          <div class="loading-bubble">
            <img src="static/meditating-fox.gif" alt="" class="loading-fox">
            <span class="loading-text">Buscando información…</span>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-container">
          <textarea id="chatInput" placeholder="Escribe tu pregunta aquí…" rows="1"></textarea>
          <button class="btn-send" id="sendBtn" title="Enviar" aria-label="Enviar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <p class="disclaimer">⚠ Aura puede cometer errores. Verifica la información importante.</p>
      </div>
    </main>
  </div>

  <div class="error-toast" id="errorToast"></div>
  <script src="static/chat.js?v=aura23"></script>
</body>

</html>
